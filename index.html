<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker | Sign in</title>
    <!-- Fav Icon -->
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- TailwindCSS + DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="bg-white rounded-2xl shadow-sm p-8 sm:p-10 w-full max-w-sm">
      <div class="flex justify-center mb-5">
        <img src="./assets/github-logo.png" alt="GitHub Logo" />
      </div>

      <h1 class="text-center text-[22px] font-bold text-gray-900 mb-1">
        GitHub Issues Tracker
      </h1>
      <p class="text-center text-sm text-gray-500 mb-6">
        Sign in to manage your issues
      </p>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-800 mb-1">
          Username
        </label>
        <input
          id="username"
          type="text"
          value="admin"
          placeholder="Enter Username"
          class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm text-gray-700 placeholder-gray-400 outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-300 transition"
        />
        <p class="text-xs text-indigo-600 mt-1">Default: admin</p>
      </div>

      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-800 mb-1">
          Password
        </label>
        <input
          id="password"
          type="password"
          value="admin123"
          placeholder="Enter Password"
          class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm text-gray-700 placeholder-gray-400 outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-300 transition"
        />
        <p class="text-xs text-indigo-600 mt-1">Default: admin123</p>
      </div>

      <button
        id="signInBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm transition"
      >
        Sign In
      </button>

      <div class="flex items-center my-4 gap-2">
        <hr class="flex-1 border-gray-200" />
        <span class="text-xs text-gray-400 font-medium">OR</span>
        <hr class="flex-1 border-gray-200" />
      </div>

      <p class="text-center text-xs text-gray-400 mb-2">Demo Credentials:</p>
      <div
        class="bg-gray-50 border border-gray-200 rounded-lg py-3 px-4 text-center"
      >
        <p class="text-sm text-gray-700">
          <span class="font-semibold">Username:</span> admin
        </p>
        <p class="text-sm text-gray-700">
          <span class="font-semibold">Password:</span> admin123
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
